name: TypeScript SDK Publish (Fork)

# Fork-specific workflow for publishing @ryanrfox/sdk
# This file should NOT be pushed to upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.3)'
        required: true
        default: '2.0.3'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9'
          run_install: false

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install
        env:
          CI: true

      - name: Run linters
        working-directory: typescript
        run: pnpm lint

      - name: Run tests
        working-directory: typescript
        run: pnpm test

      - name: Update package.json for fork publish
        working-directory: typescript
        run: |
          jq '.name = "@ryanrfox/sdk" |
              .version = "${{ github.event.inputs.version }}" |
              .repository.url = "git+https://github.com/ryanRfox/sdk.git" |
              .homepage = "https://github.com/ryanRfox/sdk/tree/main/typescript#readme" |
              .bugs.url = "https://github.com/ryanRfox/sdk/issues"' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build package
        working-directory: typescript
        run: pnpm build

      # OIDC Trusted Publishing - no token needed!
      # Requires npm trusted publisher configured at:
      # https://www.npmjs.com/package/@ryanrfox/sdk/access
      # With: owner=ryanRfox, repo=sdk, workflow=typescript-publish-fork.yml, environment=npm-publish
      - name: Publish to NPM
        working-directory: typescript
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" == *"-"* ]]; then
            npm publish --provenance --access public --tag alpha
          else
            npm publish --provenance --access public
          fi
